<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Exitoso - Congreso GenCEI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .success-card {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
        }

        .success-icon {
            font-size: 80px;
            color: #10b981;
            margin-bottom: 20px;
        }

        .folio-badge {
            background: #f0fdf4;
            color: #166534;
            padding: 10px 20px;
            border-radius: 99px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            display: inline-block;
            margin: 20px 0;
            border: 2px dashed #166534;
        }

        .summary-details {
            text-align: left;
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .summary-details p {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .summary-details span:first-child {
            font-weight: 600;
            color: #4b5563;
        }
    </style>
</head>

<body>

    <!-- Congress Banner -->
    <img src="images/newconcei.jpeg" alt="3o Congreso de Ciencias Exactas e Ingenierías" class="congress-banner">

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <section class="card success-card">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1>¡Registro Exitoso!</h1>

            <div class="folio-badge" id="folioDisplay">CONCEI-2026-XXXX</div>

            <div class="summary-details">
                <p><span>Nombre:</span> <span id="nameDisplay">---</span></p>
                <p><span>Correo:</span> <span id="emailDisplay">---</span></p>
                <p><span>Fecha:</span> <span id="dateDisplay">---</span></p>
            </div>

            <!-- Tabla de compra -->
            <div id="purchaseTable" style="margin-top: 20px; text-align: left; display: none;">
                <table style="width:100%; border-collapse: collapse; font-size: 0.9rem; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
                    <thead>
                        <tr style="background: #1e3a8a; color: white;">
                            <th style="padding: 10px 14px; text-align: left;">Concepto</th>
                            <th style="padding: 10px 14px; text-align: right;">Importe</th>
                        </tr>
                    </thead>
                    <tbody id="purchaseRows"></tbody>
                    <tfoot>
                        <tr style="background: #f1f5f9; font-weight: 700;">
                            <td style="padding: 10px 14px;">Total</td>
                            <td style="padding: 10px 14px; text-align: right; color: #1e3a8a;" id="totalDisplay">---</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Contribuciones registradas -->
            <div id="contribSection" style="margin-top: 20px; text-align: left; display: none;">
                <p style="font-weight: 700; color: #1e3a8a; font-size: 0.95rem; margin-bottom: 10px;">
                    <i class="fa-solid fa-pen-nib"></i> Contribuciones Registradas
                </p>
                <ul id="contribList" style="list-style: none; padding: 0; margin: 0;"></ul>
            </div>

            <div style="margin-top: 22px; padding: 14px 18px; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 12px; text-align: left;">
                <p style="margin: 0; color: #b91c1c; font-size: 0.92rem; line-height: 1.6; font-weight: 600;">
                    <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i>
                    Regresa a tu sesión para consultar el estado de tus documentos. Ahí podrás ver si han sido <strong>aceptados</strong>, están <strong>en revisión</strong> o requieren corrección.
                </p>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center;">
                <a href="index.html" class="submit-btn" style="text-decoration: none; background-color: var(--primary-color);">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar
                </a>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(localStorage.getItem('lastRegistration') || '{}');

            if (!data.folio) {
                window.location.href = 'crear-cuenta.html';
                return;
            }

            document.getElementById('nameDisplay').textContent = data.fullName || '---';
            document.getElementById('emailDisplay').textContent = data.email;
            document.getElementById('dateDisplay').textContent = data.date;
            document.getElementById('folioDisplay').textContent = data.folio;
            document.getElementById('totalDisplay').textContent = data.total;

            // Tabla de compra
            const tbody = document.getElementById('purchaseRows');
            const table = document.getElementById('purchaseTable');
            let rows = '';

            // Fila de tipo de registro (solo primer registro)
            if (!data.isReturning && data.regTypeLabel && data.regTypePrice > 0) {
                rows += `<tr>
                    <td style="padding: 8px 14px; border-bottom: 1px solid #e2e8f0;">Registro — ${data.regTypeLabel}</td>
                    <td style="padding: 8px 14px; border-bottom: 1px solid #e2e8f0; text-align:right;">$${data.regTypePrice.toFixed(2)}</td>
                </tr>`;
            }

            // Talleres y visitas
            if (data.purchaseItems && data.purchaseItems.length > 0) {
                data.purchaseItems.forEach(item => {
                    rows += `<tr>
                        <td style="padding: 8px 14px; border-bottom: 1px solid #e2e8f0;">${item.tipo}: ${item.nombre}</td>
                        <td style="padding: 8px 14px; border-bottom: 1px solid #e2e8f0; text-align:right;">$${item.precio.toFixed(2)}</td>
                    </tr>`;
                });
            }

            if (rows) {
                tbody.innerHTML = rows;
                table.style.display = 'block';
            }

            // Contribuciones
            if (data.contributions && data.contributions.length > 0) {
                const contribSection = document.getElementById('contribSection');
                const contribList = document.getElementById('contribList');
                data.contributions.forEach(c => {
                    const li = document.createElement('li');
                    li.style.cssText = 'background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;margin-bottom:8px;';
                    li.innerHTML = `<span style="font-weight:600;color:#1e3a8a;">${c.titulo}</span><br>
                        <small style="color:#64748b;">${c.tipo || ''}${c.area ? ' · ' + c.area : ''}${c.modalidad ? ' · ' + c.modalidad : ''}</small>`;
                    contribList.appendChild(li);
                });
                contribSection.style.display = 'block';
            }
        });
    </script>
</body>

</html>
