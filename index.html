<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Congreso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-body">
    <!-- Congress Banner -->
    <img src="images/newconcei.jpeg" alt="3o Congreso de Ciencias Exactas e Ingenierías" class="congress-banner">

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div> 

    <div class="login-container">

        <div class="login-header">
            <h2>Bienvenido al Congreso (CONCEI)</h2>
            <p>Bienvenido de vuelta al portal del congreso</p>
        </div>

        <div class="login-card">

            <form id="loginForm" class="login-form">

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                    </div>
                </div>


                <button type="submit" class="submit-btn login-submit">
                    Ingresar <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>

            </form>

            <div class="login-footer" style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0; text-align: center;">
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 12px; font-weight: 500;">¿Eres un usuario nuevo?</p>
                <a href="crear-cuenta.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 20px; border-radius: 10px; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); color: #15803d; border: 1px dashed #bbf7d0; font-weight: 700; text-decoration: none; font-size: 0.95rem; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.05); box-sizing: border-box;">
                    <i class="fa-solid fa-user-plus" style="font-size: 1.1rem;"></i> ¡Crea tu Cuenta y Regístrate Aquí!
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/login.js?v=2"></script>
</body>

</html>
