<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Dr. Anabel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 450px;
            margin: 100px auto;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }

        .login-header {
            background: var(--primary-dark);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .login-header h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
        }

        .login-body {
            padding: 40px 30px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa-solid fa-user-shield"></i>
                <h1>Acceso Administrador</h1>
                <p style="margin-top: 10px; opacity: 0.8; font-size: 0.9rem;">Panel de Gestión Dr. Anabel</p>
            </div>
            <div class="login-body">
                <div id="errorMessage" class="error-message">
                    <i class="fa-solid fa-circle-exclamation"></i> Usuario o contraseña incorrectos.
                </div>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" required placeholder="admin@dranabel.com">
                    </div>
                    <div class="form-group" style="position: relative;">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required placeholder="••••••••">
                        <i class="fa-solid fa-eye" id="togglePassword"
                            style="position: absolute; right: 15px; top: 40px; cursor: pointer; color: var(--text-light);"></i>
                    </div>
                    <button type="submit" class="login-btn">
                        Ingresar al Panel <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
                <a href="index.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Volver al sitio principal
                </a>
            </div>
        </div>
    </div>

    <script src="js/admin.js?v=5"></script>
</body>

</html>
